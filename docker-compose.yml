version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: freshdash-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: freshdash_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_freshdash:/var/lib/postgresql/data
    networks:
      - homelab-net

volumes:
  postgres_data_freshdash:

networks:
  homelab-net:
    external: true
